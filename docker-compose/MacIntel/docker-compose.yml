version: "3.3"
services:
  # Container mysql
  mysql:
    container_name: crmeb_mysql #Chỉ định tên container
    image: mysql:5.7 #Máy tính thông thường có thể dùng image này
    ports:
      - 3336:3306
    # Biến môi trường
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: '123456'
      MYSQL_USER: 'crmeb'
      MYSQL_PASS: '123456'
      MYSQL_DATABASE: 'crmeb'
    privileged: true
    command:
       --character-set-server=utf8mb4
       --collation-server=utf8mb4_general_ci
       --explicit_defaults_for_timestamp=true
       --lower_case_table_names=1
       --max_allowed_packet=128M
       --default-authentication-plugin=mysql_native_password
       --sql-mode="NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION"
    working_dir: /var/lib/mysql
    volumes:
      - ./mysql/my.cnf:/etc/mysql/my.cnf
      - ./mysql/data:/var/lib/mysql #Mount thư mục dữ liệu về máy local
      - ./mysql/log:/var/log/mysql
    networks:
      app_net:
        # Cố định IP subnet, dải mạng phải nằm trong subnet 192.168.*.*
        ipv4_address: 192.168.10.11
  # Container redis
  redis:
    container_name: crmeb_redis
    image: 'redis:alpine'
    # image: daocloud.io/library/redis:6.0.5-alpine
    # image: redis:5.0
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      # - ./redis/data:/data #Mount thư mục dữ liệu về máy local
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      app_net:
        ipv4_address: 192.168.10.10
  # Container php
  phpfpm:
    container_name: crmeb_php #Chỉ định tên container
    # image: phpfpm-image #Chỉ định tên image
    image: crmeb_php #Chỉ định tên image
    build:
      context: ./php #Đường dẫn file dockerfile
      dockerfile: Dockerfile #Chỉ định tên file dockerfile
    restart: always
    environment:
      TZ: Asia/Ho_Chi_Minh
    ports:
      - 9000:9000
      - 40001:40001
      - 40002:40002
      - 40003:40003
    tmpfs: /var/temp #Thư mục tạm khi tải lên
    working_dir: /var/www
    volumes:
      - ../../crmeb:/var/www #Thư mục chạy chương trình
      - ../../crmeb/runtime:/var/www/temp #Thư mục cache chương trình
      - ./php/php-ini-overrides.ini:/etc/php/7.4/fpm/conf.d/99-overrides.ini
    networks:
      app_net:
        ipv4_address: 192.168.10.90
#    command: /bin/bash -c "php -v"
  # Container nginx
  nginx:
    container_name: crmeb_nginx
    image: 'nginx:alpine'
    # image: daocloud.io/library/nginx:1.19.1-alpine
    restart: always
    ports:
      - 8011:80
      # - 443:443
    # Quan hệ phụ thuộc: chạy php trước
    depends_on:
      - phpfpm
    environment:
      TZ: Asia/Ho_Chi_Minh
    working_dir: /var/www
    volumes_from:
      - phpfpm #Kế thừa thư mục mount của phpfpm
    volumes:
      - ./nginx/vhost.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/log:/etc/nginx/log
    networks:
      app_net:
        ipv4_address: 192.168.10.80
networks: #Cấu hình mạng
  app_net: #Tên mạng
    driver: bridge
    ipam: #Cấu hình mạng
      driver: default
      config:
        - subnet: 192.168.10.0/24 #Dải IP

