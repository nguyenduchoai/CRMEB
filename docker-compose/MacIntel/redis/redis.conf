# File cấu hình mẫu của Redis

# Note on units: when memory size is needed, it is possible to specifiy
# it in the usual form of 1k 5GB 4M and so forth:
#
# 1k => 1000 bytes
# 1kb => 1024 bytes
# 1m => 1000000 bytes
# 1mb => 1024*1024 bytes
# 1g => 1000000000 bytes
# 1gb => 1024*1024*1024 bytes
#
# units are case insensitive so 1GB 1Gb 1gB are all the same.

# Mặc định Redis không chạy dưới dạng daemon, có thể sửa qua tùy chọn cấu hình này, dùng yes để bật daemon
# Sau khi bật daemon, Redis sẽ ghi pid vào một pidfile, tại /var/run/redis.pid
daemonize no

# Khi Redis chạy dưới dạng daemon, mặc định Redis sẽ ghi pid vào file /var/run/redis.pid, có thể chỉ định qua pidfile
pidfile /var/run/redis.pid

# Chỉ định port lắng nghe của Redis, port mặc định là 6379
# Nếu chỉ định port 0, nghĩa là Redis không lắng nghe kết nối TCP
port 6379

# Địa chỉ host được bind
# Bạn có thể bind một interface duy nhất, nếu không bind thì mọi interface đều sẽ lắng nghe kết nối đến
# bind 127.0.0.1
protected-mode no

# Specify the path for the unix socket that will be used to listen for
# incoming connections. There is no default, so Redis will not listen
# on a unix socket when not specified.
#
# unixsocket /tmp/redis.sock
# unixsocketperm 755

# Sau bao lâu client rảnh thì đóng kết nối, nếu chỉ định là 0 nghĩa là tắt tính năng này
timeout 0

# Chỉ định mức ghi log, Redis hỗ trợ tổng cộng 4 mức: debug, verbose, notice, warning, mặc định là verbose
# debug (nhiều thông tin, hữu ích cho phát triển/kiểm thử)
# verbose (many rarely useful info, but not a mess like the debug level)
# notice (moderately verbose, what you want in production probably)
# warning (only very important / critical messages are logged)
loglevel verbose

# Cách ghi log, mặc định là xuất ra standard output, nếu cấu hình Redis chạy dưới dạng daemon mà ở đây vẫn cấu hình xuất ra standard output, thì log sẽ được gửi tới /dev/null
# logfile /logs/redis.log

# To enable logging to the system logger, just set 'syslog-enabled' to yes,
# and optionally update the other syslog parameters to suit your needs.
# syslog-enabled no

# Specify the syslog identity.
# syslog-ident redis

# Specify the syslog facility.  Must be USER or between LOCAL0-LOCAL7.
# syslog-facility local0

# Đặt số lượng database, database mặc định là 0, có thể dùng lệnh select <dbid> trên kết nối để chỉ định id database
# dbid là số từ 0 đến 'databases'-1
databases 16

################################ SNAPSHOTTING  #################################
# Chỉ định trong khoảng thời gian bao lâu, có bao nhiêu lần cập nhật thì sẽ đồng bộ dữ liệu vào file dữ liệu, có thể kết hợp nhiều điều kiện
# Save the DB on disk:
#
#   save <seconds> <changes>
#
#   Will save the DB if both the given number of seconds and the given
#   number of write operations against the DB occurred.
#
#   Thỏa các điều kiện sau sẽ đồng bộ dữ liệu:
#   Trong 900 giây (15 phút) có 1 thay đổi
#   Trong 300 giây (5 phút) có 10 thay đổi
#   Trong 60 giây có 10000 thay đổi
#   Note: có thể comment hết các dòng “save”, như vậy sẽ hủy bỏ thao tác đồng bộ

save 900 1
save 300 10
save 60 10000

# Chỉ định khi lưu vào database local có nén dữ liệu hay không, mặc định là yes, Redis dùng nén LZF, nếu muốn tiết kiệm thời gian CPU thì có thể tắt tùy chọn này, nhưng sẽ khiến file database trở nên rất lớn
rdbcompression yes

# Chỉ định tên file database local, giá trị mặc định là dump.rdb
dbfilename dump.rdb

# Thư mục làm việc.
# Chỉ định thư mục lưu database local, tên file do tùy chọn cấu hình dbfilename phía trên chỉ định
#
# Also the Append Only File will be created inside this directory.
#
# Chú ý, ở đây chỉ có thể chỉ định một thư mục, không thể chỉ định tên file
dir ./

################################# REPLICATION #################################

# Master-slave replication. Dùng slaveof để sao chép một instance Redis từ server Redis khác. Chú ý, cấu hình này chỉ có hiệu lực với slave hiện tại
# so for example it is possible to configure the slave to save the DB with a
# different interval, or to listen to another port, and so on.
# Khi máy này là dịch vụ slav, đặt địa chỉ IP và port của dịch vụ master, khi Redis khởi động nó sẽ tự động đồng bộ dữ liệu từ master
# slaveof <masterip> <masterport>


# Khi dịch vụ master đã đặt bảo vệ bằng mật khẩu, mật khẩu để dịch vụ slav kết nối đến master
# Tùy chọn cấu hình “requirepass” ở phần dưới có thể chỉ định mật khẩu
# masterauth <master-password>

# When a slave lost the connection with the master, or when the replication
# is still in progress, the slave can act in two different ways:
#
# 1) if slave-serve-stale-data is set to 'yes' (the default) the slave will
#    still reply to client requests, possibly with out of data data, or the
#    data set may just be empty if this is the first synchronization.
#
# 2) if slave-serve-stale data is set to 'no' the slave will reply with
#    an error "SYNC with master in progress" to all the kind of commands
#    but to INFO and SLAVEOF.
#
slave-serve-stale-data yes

# Slaves send PINGs to server in a predefined interval. It's possible to change
# this interval with the repl_ping_slave_period option. The default value is 10
# seconds.
#
# repl-ping-slave-period 10

# The following option sets a timeout for both Bulk transfer I/O timeout and
# master data or ping response timeout. The default value is 60 seconds.
#
# It is important to make sure that this value is greater than the value
# specified for repl-ping-slave-period otherwise a timeout will be detected
# every time there is low traffic between the master and the slave.
#
# repl-timeout 60

################################## SECURITY ###################################

# Warning: since Redis is pretty fast an outside user can try up to
# 150k passwords per second against a good box. This means that you should
# use a very strong password otherwise it will be very easy to break.
# Đặt mật khẩu kết nối Redis, nếu đã cấu hình mật khẩu kết nối, client khi kết nối Redis cần cung cấp mật khẩu qua lệnh auth <password>, mặc định tắt
requirepass 123456
# Command renaming.
#
# It is possilbe to change the name of dangerous commands in a shared
# environment. For instance the CONFIG command may be renamed into something
# of hard to guess so that it will be still available for internal-use
# tools but not available for general clients.
#
# Example:
#
# rename-command CONFIG b840fc02d524045429941cc15f59e41cb7be6c52
#
# It is also possilbe to completely kill a command renaming it into
# an empty string:
#
# rename-command CONFIG ""

################################### LIMITS ####################################

# Đặt số kết nối client tối đa cùng lúc, mặc định không giới hạn, số kết nối client Redis có thể mở đồng thời bằng số file descriptor tối đa mà tiến trình Redis có thể mở,
# Nếu đặt maxclients 0, nghĩa là không giới hạn. Khi số kết nối client đạt đến giới hạn, Redis sẽ đóng kết nối mới và trả về cho client thông báo lỗi max Number of clients reached
# maxclients 128

# Don't use more memory than the specified amount of bytes.
# When the memory limit is reached Redis will try to remove keys with an
# EXPIRE set. It will try to start freeing keys that are going to expire
# in little time and preserve keys with a longer time to live.
# Redis will also try to remove objects from free lists if possible.
#
# If all this fails, Redis will start to reply with errors to commands
# that will use more memory, like SET, LPUSH, and so on, and will continue
# to reply to most read-only commands like GET.
#
# WARNING: maxmemory can be a good idea mainly if you want to use Redis as a
# 'state' server or cache, not as a real DB. When Redis is used as a real
# database the memory usage will grow over the weeks, it will be obvious if
# it is going to use too much memory in the long run, and you'll have the time
# to upgrade. With maxmemory after the limit is reached you'll start to get
# errors for write operations, and this may even lead to DB inconsistency.
# Chỉ định giới hạn bộ nhớ tối đa của Redis, khi khởi động Redis sẽ nạp dữ liệu vào bộ nhớ, khi đạt bộ nhớ tối đa, Redis sẽ thử xóa các Key đã hết hạn hoặc sắp hết hạn trước,
# Sau khi xử lý theo cách này mà vẫn đạt mức bộ nhớ tối đa đã đặt, sẽ không thể thực hiện thao tác ghi nữa, nhưng vẫn có thể thực hiện thao tác đọc.
# Cơ chế vm mới của Redis sẽ lưu Key trong bộ nhớ, Value sẽ được lưu ở vùng swap
# maxmemory <bytes>

# MAXMEMORY POLICY: how Redis will select what to remove when maxmemory
# is reached? You can select among five behavior:
#
# volatile-lru -> remove the key with an expire set using an LRU algorithm
# allkeys-lru -> remove any key accordingly to the LRU algorithm
# volatile-random -> remove a random key with an expire set
# allkeys->random -> remove a random key, any key
# volatile-ttl -> remove the key with the nearest expire time (minor TTL)
# noeviction -> don't expire at all, just return an error on write operations
#
# Note: with all the kind of policies, Redis will return an error on write
#       operations, when there are not suitable keys for eviction.
#
#       At the date of writing this commands are: set setnx setex append
#       incr decr rpush lpush rpushx lpushx linsert lset rpoplpush sadd
#       sinter sinterstore sunion sunionstore sdiff sdiffstore zadd zincrby
#       zunionstore zinterstore hset hsetnx hmset hincrby incrby decrby
#       getset mset msetnx exec sort
#
# The default is:
#
# maxmemory-policy volatile-lru

# LRU and minimal TTL algorithms are not precise algorithms but approximated
# algorithms (in order to save memory), so you can select as well the sample
# size to check. For instance for default Redis will check three keys and
# pick the one that was used less recently, you can change the sample size
# using the following configuration directive.
#
# maxmemory-samples 3

############################## APPEND ONLY MODE ###############################

#
# Note that you can have both the async dumps and the append only file if you
# like (you have to comment the "save" statements above to disable the dumps).
# Still if append only mode is enabled Redis will load the data from the
# log file at startup ignoring the dump.rdb file.
# Chỉ định có ghi log sau mỗi thao tác cập nhật hay không, mặc định Redis ghi dữ liệu xuống đĩa một cách bất đồng bộ, nếu không bật, có thể gây mất dữ liệu trong một khoảng thời gian khi mất điện.
# Vì bản thân redis đồng bộ file dữ liệu theo điều kiện save ở trên, nên có dữ liệu sẽ chỉ tồn tại trong bộ nhớ trong một khoảng thời gian. Mặc định là no
# IMPORTANT: Check the BGREWRITEAOF to check how to rewrite the append
# log file in background when it gets too big.

appendonly yes

# Chỉ định tên file update log, mặc định là appendonly.aof
# appendfilename appendonly.aof

# The fsync() call tells the Operating System to actually write data on disk
# instead to wait for more data in the output buffer. Some OS will really flush
# data on disk, some other OS will just try to do it ASAP.

# Chỉ định điều kiện update log, có tổng cộng 3 giá trị có thể chọn:
# no: nghĩa là chờ hệ điều hành đồng bộ cache dữ liệu xuống đĩa (nhanh)
# always: nghĩa là sau mỗi thao tác cập nhật sẽ gọi thủ công fsync() để ghi dữ liệu xuống đĩa (chậm, an toàn)
# everysec: nghĩa là đồng bộ mỗi giây một lần (dung hòa, giá trị mặc định)

appendfsync everysec
# appendfsync no

# When the AOF fsync policy is set to always or everysec, and a background
# saving process (a background save or AOF log background rewriting) is
# performing a lot of I/O against the disk, in some Linux configurations
# Redis may block too long on the fsync() call. Note that there is no fix for
# this currently, as even performing fsync in a different thread will block
# our synchronous write(2) call.
#
# In order to mitigate this problem it's possible to use the following option
# that will prevent fsync() from being called in the main process while a
# BGSAVE or BGREWRITEAOF is in progress.
#
# This means that while another child is saving the durability of Redis is
# the same as "appendfsync none", that in pratical terms means that it is
# possible to lost up to 30 seconds of log in the worst scenario (with the
# default Linux settings).
#
# If you have latency problems turn this to "yes". Otherwise leave it as
# "no" that is the safest pick from the point of view of durability.
no-appendfsync-on-rewrite no

# Automatic rewrite of the append only file.
# Redis is able to automatically rewrite the log file implicitly calling
# BGREWRITEAOF when the AOF log size will growth by the specified percentage.
#
# This is how it works: Redis remembers the size of the AOF file after the
# latest rewrite (or if no rewrite happened since the restart, the size of
# the AOF at startup is used).
#
# This base size is compared to the current size. If the current size is
# bigger than the specified percentage, the rewrite is triggered. Also
# you need to specify a minimal size for the AOF file to be rewritten, this
# is useful to avoid rewriting the AOF file even if the percentage increase
# is reached but it is still pretty small.
#
# Specify a precentage of zero in order to disable the automatic AOF
# rewrite feature.

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################## SLOW LOG ###################################

# The Redis Slow Log is a system to log queries that exceeded a specified
# execution time. The execution time does not include the I/O operations
# like talking with the client, sending the reply and so forth,
# but just the time needed to actually execute the command (this is the only
# stage of command execution where the thread is blocked and can not serve
# other requests in the meantime).
#
# You can configure the slow log with two parameters: one tells Redis
# what is the execution time, in microseconds, to exceed in order for the
# command to get logged, and the other parameter is the length of the
# slow log. When a new command is logged the oldest one is removed from the
# queue of logged commands.

# The following time is expressed in microseconds, so 1000000 is equivalent
# to one second. Note that a negative number disables the slow log, while
# a value of zero forces the logging of every command.
slowlog-log-slower-than 10000

# There is no limit to this length. Just be aware that it will consume memory.
# You can reclaim memory used by the slow log with SLOWLOG RESET.
slowlog-max-len 1024

################################ VIRTUAL MEMORY ###############################

### WARNING! Virtual Memory is deprecated in Redis 2.4
### The use of Virtual Memory is strongly discouraged.

### WARNING! Virtual Memory is deprecated in Redis 2.4
### The use of Virtual Memory is strongly discouraged.

# Virtual Memory allows Redis to work with datasets bigger than the actual
# amount of RAM needed to hold the whole dataset in memory.
# In order to do so very used keys are taken in memory while the other keys
# are swapped into a swap file, similarly to what operating systems do
# with memory pages.
# Chỉ định có bật cơ chế bộ nhớ ảo hay không, giá trị mặc định là no,
# Cơ chế VM lưu dữ liệu theo trang (page), Redis sẽ swap các trang truy cập ít (dữ liệu lạnh) xuống đĩa, các trang truy cập nhiều sẽ được tự động đưa từ đĩa vào bộ nhớ
# Đặt vm-enabled thành yes, cấu hình đủ 3 tham số VM tiếp theo tùy theo nhu cầu, là có thể khởi động VM
# vm-enabled no
# vm-enabled yes

# This is the path of the Redis swap file. As you can guess, swap files
# can't be shared by different Redis instances, so make sure to use a swap
# file for every redis process you are running. Redis will complain if the
# swap file is already in use.
#
# Nơi lưu trữ tốt nhất cho file swap của Redis là SSD (ổ cứng thể rắn)
# Đường dẫn file bộ nhớ ảo, giá trị mặc định là /tmp/redis.swap, không thể dùng chung cho nhiều instance Redis
# *** WARNING *** if you are using a shared hosting the default of putting
# the swap file under /tmp is not secure. Create a dir with access granted
# only to Redis user and configure Redis to create the swap file there.
# vm-swap-file /tmp/redis.swap

# With vm-max-memory 0 the system will swap everything it can. Not a good
# default, just specify the max amount of RAM you can in bytes, but it's
# better to leave some margin. For instance specify an amount of RAM
# that's more or less between 60 and 80% of your free RAM.
# Lưu toàn bộ dữ liệu lớn hơn vm-max-memory vào bộ nhớ ảo, dù vm-max-memory được đặt bao nhiêu thì toàn bộ dữ liệu chỉ mục vẫn được lưu trong bộ nhớ (dữ liệu chỉ mục của Redis chính là các keys)
# Tức là khi vm-max-memory được đặt là 0, thực chất toàn bộ value đều nằm trên đĩa. Giá trị mặc định là 0
# vm-max-memory 0

# File swap của Redis được chia thành nhiều page, một object có thể được lưu trên nhiều page, nhưng một page không thể được nhiều object dùng chung, vm-page-size cần được đặt dựa theo kích thước dữ liệu lưu trữ.
# Khuyến nghị nếu lưu nhiều object nhỏ, nên đặt kích thước page là 32 hoặc 64 bytes; nếu lưu object lớn, có thể dùng page lớn hơn, nếu không chắc chắn thì dùng giá trị mặc định
# vm-page-size 32

# Đặt số lượng page trong file swap, do bảng trang (page table - một loại bitmap thể hiện trang trống hay đang dùng) được lưu trong bộ nhớ, nên cứ 8 page trên đĩa sẽ tốn 1 byte bộ nhớ
# Tổng dung lượng vùng swap là vm-page-size * vm-pages
#
# With the default of 32-bytes memory pages and 134217728 pages Redis will
# use a 4 GB swap file, that will use 16 MB of RAM for the page table.
#
# It's better to use the smallest acceptable value for your application,
# but the default is large in order to work in most conditions.
# vm-pages 134217728

# Max number of VM I/O threads running at the same time.
# This threads are used to read/write data from/to swap file, since they
# also encode and decode objects from disk to memory or the reverse, a bigger
# number of threads can help with big objects even if they can't help with
# I/O itself as the physical device may not be able to couple with many
# reads/writes operations at the same time.
# Đặt số luồng I/O truy cập file swap, tốt nhất không nên vượt quá số nhân của máy, nếu đặt là 0 thì mọi thao tác trên file swap sẽ chạy tuần tự, có thể gây độ trễ khá lớn, giá trị mặc định là 4
# vm-max-threads 4

############################### ADVANCED CONFIG ###############################

# Hashes are encoded in a special way (much more memory efficient) when they
# have at max a given numer of elements, and the biggest element does not
# exceed a given threshold. You can configure this limits with the following
# configuration directives.
# Chỉ định khi vượt quá một số lượng nhất định hoặc phần tử lớn nhất vượt một ngưỡng nào đó, sẽ dùng một thuật toán hash đặc biệt
# hash-max-zipmap-entries 512
# hash-max-zipmap-value 64

# Similarly to hashes, small lists are also encoded in a special way in order
# to save a lot of space. The special representation is only used when
# you are under the following limits:
list-max-ziplist-entries 512
list-max-ziplist-value 64

# Sets have a special encoding in just one case: when a set is composed
# of just strings that happens to be integers in radix 10 in the range
# of 64 bit signed integers.
# The following configuration setting sets the limit in the size of the
# set in order to use this special memory saving encoding.
set-max-intset-entries 512

# Similarly to hashes and lists, sorted sets are also specially encoded in
# order to save a lot of space. This encoding is only used when the length and
# elements of a sorted set are below the following limits:
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Active rehashing uses 1 millisecond every 100 milliseconds of CPU time in
# order to help rehashing the main Redis hash table (the one mapping top-level
# keys to values). The hash table implementation redis uses (see dict.c)
# performs a lazy rehashing: the more operation you run into an hash table
# that is rhashing, the more rehashing "steps" are performed, so if the
# server is idle the rehashing is never complete and some more memory is used
# by the hash table.
#
# The default is to use this millisecond 10 times every second in order to
# active rehashing the main dictionaries, freeing memory when possible.
#
# If unsure:
# use "activerehashing no" if you have hard latency requirements and it is
# not a good thing in your environment that Redis can reply form time to time
# to queries with 2 milliseconds delay.
# Chỉ định có kích hoạt reset hash hay không, mặc định là bật
activerehashing yes

################################## INCLUDES ###################################

# Chỉ định bao gồm file cấu hình khác, có thể dùng chung một file cấu hình giữa nhiều instance Redis trên cùng một host, đồng thời mỗi instance vẫn có file cấu hình riêng của mình
# include /path/to/local.conf
# include /path/to/other.conf


