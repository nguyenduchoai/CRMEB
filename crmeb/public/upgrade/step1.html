<!DOCTYPE html>
<html>
<head>
    <title>{$title|default=''} - {$powered|default=''}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link href="../statics/css/layui.css" rel="stylesheet">
    <script src="../statics/js/layui.js"></script>
    <script src="../statics/js/jquery.js"></script>
    <script src="../statics/js/vue.js"></script>
    <script src="../statics/js/axios.js"></script>
    <style>
        body {
            background-color: #f3f3f4;
            margin-top: 10px;
        }
        .centered {
            text-align: center;
        }
        .centered button {
            width: 200px;
            height: 60px;
        }
    </style>
</head>
<body>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15" id="app" v-cloak="">
        <div class="layui-card">
            <div class="centered">
                <div class="layui-progress">
                    <div class="layui-progress-bar layui-bg-blue" lay-percent="100%"></div>
                </div>
            </div>
            <div class="layui-card-header">Nâng cấp hệ thống</div>
            <div class="layui-card-body">
                <div class="layui-row">
                    <p style="font-size: 18px;">Cập nhật phiên bản: <span style="color: red">{$version_now} - {$version_new}</span></p>
                    <div class="layui-form-item" style="margin-top: 10px">
                        <label class="layui-form-label" style="font-size: 18px;padding-left: 0;">Tiền tố bảng</label>
                        <div class="layui-input-block">
                            <input type="text" style="width: 10%" v-model="prefix" name="title" lay-verify="title"
                                   autocomplete="off" placeholder="Vui lòng nhập tiền tố bảng" class="layui-input">
                        </div>
                    </div>
                </div>
                <div class="centered">
                    <button type="button" class="layui-btn layui-btn-normal layui-btn-radius" v-if="isUpgrade && executeIng">
                        Đang nâng cấp
                    </button>
                    <button type="button" class="layui-btn layui-btn-normal layui-btn-radius" v-if="isUpgrade && !executeIng"
                            @click="startUpgrade">Nâng cấp ngay
                    </button>
                    <button type="button" class="layui-btn layui-btn-normal layui-btn-radius" v-else-if="isUpgrade == false">Không cần nâng cấp</button>
                </div>
            </div>
            <div class="layui-card-body">
                <div class="layui-form">
                    <table class="layui-table">
                        <thead>
                        <tr>
                            <th>Tên bảng</th>
                            <th>Trạng thái thực thi</th>
                            <th width="40%">Nguyên nhân lỗi</th>
                            <th>Thời gian thực thi</th>
                            <th width="12%">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr v-for="(item,index) in upgradeData">
                            <td>{{item.table}}</td>
                            <td>{{item.status ? 'Thực thi thành công':'Thực thi thất bại'}}</td>
                            <td>{{item.error}}</td>
                            <td>{{item.add_time}}</td>
                            <td>Không có thao tác</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="layui-form">

                </div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" charset="utf-8">
    var isUpgrade = <?=$isUpgrade ? 'true' : 'false'?>;
    new Vue({
        el: '#app',
        data: {
            sleep: 0,
            prefix: 'eb_',
            upgradeData: [],
            isUpgrade: isUpgrade,
            executeIng: false,
            page: 1,
        },
        methods: {
            startUpgrade: function () {
                var that = this;
                if (!that.prefix) {
                    return that.showMsg('Vui lòng điền tiền tố bảng');
                }
                this.requestGet('upgrade/run', {
                    sleep: this.sleep,
                    prefix: this.prefix,
                    page: this.page
                }).then(function (res) {
                    if (res.data.sleep !== -1) {
                        if (res.data.page) {
                            that.page = res.data.page;
                        }
                        that.sleep = res.data.sleep;
                        that.upgradeData.push(res.data);
                        that.executeIng = true;
                        setTimeout(function () {
                            that.startUpgrade();
                        }, 100);
                    } else {
                        that.isUpgrade = false;
                        that.nextAction = true;
                        that.executeIng = false;
                        return that.showMsg('Đã thực thi xong');
                    }
                }).catch(function (res) {
                    return that.showMsg(res.msg);
                });
            },
            requestGet: function (url, data) {
                var params = Object.keys(data).map(function (key) {
                    return key + '=' + data[key];
                }).join('&');
                return new Promise(function (resolve, reject) {
                    axios.get(url + (params ? '?' + params : '')).then(function (res) {
                        if (res.status == 200) {
                            resolve(res.data)
                        } else {
                            reject(res.data);
                        }
                    }).catch(function (err) {
                        reject({msg: err})
                    });
                })
            },
            showMsg: function (msg, success) {
                alert(msg);
            },
        }
    })
</script>
</body>
</html>
